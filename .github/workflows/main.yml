# ── Node.js ───────────────────────────────────────────────────
name: Pipeline Node.js

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: hakimsa/shared-workflows/.github/workflows/reusable-ci.yml@main
    with:
      setup-node: true
      node-version: '20'
      install-command: npm ci
      run-tests: false
      build-command : npm run build
      artifact-path: dist/
    
    secrets: inherit